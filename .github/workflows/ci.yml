name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pytests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t", "3.15", "3.15t", "pypy-3.11", "pypy-3.12"]
        exclude:
          - os: windows-latest
            python-version: ["pypy-3.11", "pypy-3.12"]
          - os: macos-latest
            python-version: "pypy-3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      - run: pip install pytest pytest-asyncio
      - run: pip install --editable .
      - run: pytest tests/test_medie.py
  doc_format:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'readme-renderer[md]'
      - run: python -m readme_renderer README.md -o /dev/null
